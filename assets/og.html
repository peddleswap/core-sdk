<!doctype html>
<meta charset="utf-8" />
<title>@peddleswap/sdk — social card</title>
<!--
  Source for assets/og.png, the social preview card.

  Rendered with: node scripts/chrome/shot.mjs packages/sdk/assets/og.html \
                      packages/sdk/assets/og.png 1280 640 2

  Kept as HTML on purpose. A card is a thing that gets edited -- a new chain, a renamed
  package -- and a committed PNG with no source is a thing nobody can edit. Colours are
  the brand kit's tokens (web/src/app/globals.css, --dark-*), type is the kit's pair (Exo 2
  and JetBrains Mono), and assets/wordmark.png is the kit wordmark
  (web/public/brand/kit/logos/peddleswap-wordmark-2x.png), copied beside this file so the
  card still renders in the standalone SDK repo.

  Sized 1280x640, which is GitHub's recommended social preview. Rendered at 2x so it stays
  crisp when a platform shows it large, and downscales cleanly when one shows it small.

  READ IT AT THUMBNAIL SIZE. Most impressions of this image are ~300px wide in a Slack
  unfurl or a link card, so there is one headline, one line of prose, and three facts.
  Anything more becomes grey texture at the size people actually see.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,800;1,900&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --night: #0a0d14;
    --graphite: #191d28;
    --slate: #262c38;
    --steel: #8a93a3;
    --mist: #aeb5c2;
    --chrome: #ececee;
    --lime: #c4f44a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 640px; }

  body {
    background: var(--night);
    color: var(--chrome);
    font-family: "Exo 2", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* One lime wash and the kit's faceted shards on the right, so the card has depth
     without a gradient across the whole field. */
  .glow {
    position: absolute;
    right: -260px;
    top: -220px;
    width: 980px;
    height: 980px;
    background: radial-gradient(circle, rgba(196, 244, 74, 0.13) 0%, rgba(196, 244, 74, 0) 62%);
  }
  .shards { position: absolute; right: 0; top: 0; width: 520px; height: 640px; }

  .frame {
    position: relative;
    height: 100%;
    padding: 68px 86px 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 54px;
  }

  .wordmark { height: 50px; display: block; }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 17px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lime);
    margin-top: 22px;
  }

  h1 {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 76px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  h1 .scope { color: var(--steel); }

  .lede {
    font-size: 30px;
    line-height: 1.38;
    color: var(--mist);
    /* 44ch lands this on two lines; narrower leaves "contracts." alone on a third. */
    max-width: 44ch;
    margin-top: 24px;
  }

  .facts { display: flex; gap: 14px; align-items: center; }

  .chip {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px;
    color: var(--chrome);
    background: var(--graphite);
    border: 1px solid var(--slate);
    border-radius: 999px;
    padding: 11px 20px;
    white-space: nowrap;
  }
  .chip .dim { color: var(--steel); }

  .install {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 19px;
    color: var(--night);
    background: var(--lime);
    border-radius: 12px;
    padding: 12px 20px;
  }
</style>

<div class="glow"></div>
<svg class="shards" viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="250,40 470,150 330,330" fill="#c4f44a" fill-opacity="0.16" />
  <polygon points="380,260 520,200 520,520" fill="#c4f44a" fill-opacity="0.10" />
  <polygon points="300,420 460,470 360,600" fill="#c4f44a" fill-opacity="0.13" />
  <polygon points="430,40 500,20 480,110" fill="#c4f44a" fill-opacity="0.22" />
</svg>

<div class="frame">
  <div>
    <img class="wordmark" src="wordmark.png" alt="PeddleSwap" />
    <div class="eyebrow">TypeScript SDK</div>

    <h1 style="margin-top: 40px"><span class="scope">@peddleswap/</span>sdk</h1>

    <p class="lede">Addresses, ABIs and chain definitions — generated from the deployed contracts.</p>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div class="facts">
      <span class="chip">Robinhood Chain <span class="dim">4663</span></span>
      <span class="chip">Sepolia <span class="dim">11155111</span></span>
      <span class="chip">V2 <span class="dim">+</span> V3</span>
    </div>
    <div class="install">npm i @peddleswap/sdk</div>
  </div>
</div>
