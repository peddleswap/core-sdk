<!doctype html>
<meta charset="utf-8" />
<title>@peddleswap/sdk — social card</title>
<!--
  Source for assets/og.png, the social preview card.

  Rendered with: node scripts/chrome/shot.mjs packages/sdk/assets/og.html \
                      packages/sdk/assets/og.png 1280 640 2

  Kept as HTML on purpose. A card is a thing that gets edited -- a new chain, a renamed
  package -- and a committed PNG with no source is a thing nobody can edit. The palette
  and the mark geometry below are transcribed from the product rather than approximated:
  colours are the --dark-* tokens in web/src/app/globals.css, and the mark is the exact
  viewBox from components/brand.tsx.

  Sized 1280x640, which is GitHub's recommended social preview. Rendered at 2x so it stays
  crisp when a platform shows it large, and downscales cleanly when one shows it small.

  READ IT AT THUMBNAIL SIZE. Most impressions of this image are ~300px wide in a Slack
  unfurl or a link card, so there is one headline, one line of prose, and three facts.
  Anything more becomes grey texture at the size people actually see.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #04060c;
    --pane: #070c17;
    --surface2: #0b1220;
    --text: #e4ecf9;
    --accent: #2b8bff;
    --blue: #4a9bff;
    --rule: #16223a;
    --muted: #7c8aa5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1280px; height: 640px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* A single wash behind the mark, so the card has depth without a gradient across the
     whole field -- full-bleed gradients are the thing that makes a card look generated. */
  .glow {
    position: absolute;
    left: -140px;
    top: -200px;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(43, 139, 255, 0.18) 0%, rgba(43, 139, 255, 0) 62%);
  }

  /* The candle grid, at 4% -- it reads as texture, not decoration, and ties the card to
     the product's own chart surfaces. */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(228, 236, 249, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(228, 236, 249, 0.04) 1px, transparent 1px);
    background-size: 64px 64px;
  }

  .frame {
    position: relative;
    height: 100%;
    padding: 68px 86px 64px;
    display: flex;
    flex-direction: column;
    /* center, not space-between. The content is ~470px tall in a 640px card, and
       space-between spent the whole remainder in one gap in the middle. Centering
       distributes it as margin, which is what the card actually wanted. */
    justify-content: center;
    gap: 54px;
  }

  .top { display: flex; align-items: center; gap: 26px; }

  .mark { width: 92px; height: 92px; flex: none; }

  .wordmark {
    font-family: "Poppins", system-ui, sans-serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.015em;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 17px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  h1 {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: 76px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  h1 .scope { color: var(--muted); }

  .lede {
    font-size: 30px;
    line-height: 1.38;
    color: #b9c6dc;
    /* 44ch lands this on two lines. At 30ch it broke three ways and left "contracts."
       alone on the last one -- a widow is conspicuous at this type size. */
    max-width: 44ch;
    margin-top: 24px;
  }

  .facts {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .chip {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 18px;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 11px 20px;
    white-space: nowrap;
  }
  .chip .dim { color: var(--muted); }

  .install {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    color: var(--blue);
    border-left: 3px solid var(--accent);
    padding-left: 16px;
  }
</style>

<div class="glow"></div>
<div class="grid"></div>

<div class="frame">
  <div>
    <div class="top">
      <!-- Mark geometry from web/src/components/brand.tsx, 100x100 viewBox:
           left candle x22 y26 w20 h52 r6 (accent), right x58 y14 w20 h40 r6 (token),
           link x41 y44 w18 h6 r3, wicks 2.5 wide. -->
      <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="30.75" y="13" width="2.5" height="15" fill="#2b8bff" />
        <rect x="30.75" y="76" width="2.5" height="12" fill="#2b8bff" />
        <rect x="66.75" y="4" width="2.5" height="12" fill="#e4ecf9" />
        <rect x="66.75" y="52" width="2.5" height="14" fill="#e4ecf9" />
        <rect x="22" y="26" width="20" height="52" rx="6" fill="#2b8bff" />
        <rect x="58" y="14" width="20" height="40" rx="6" fill="#e4ecf9" />
        <rect x="41" y="44" width="18" height="6" rx="3" fill="#2b8bff" />
      </svg>
      <div>
        <div class="wordmark">PeddleSwap</div>
        <div class="eyebrow">TypeScript SDK</div>
      </div>
    </div>

    <h1 style="margin-top: 40px"><span class="scope">@peddleswap/</span>sdk</h1>

    <p class="lede">Addresses, ABIs and chain definitions — generated from the deployed contracts.</p>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div class="facts">
      <span class="chip">Robinhood Chain <span class="dim">4663</span></span>
      <span class="chip">Sepolia <span class="dim">11155111</span></span>
      <span class="chip">V2 <span class="dim">+</span> V3</span>
    </div>
    <div class="install">npm i @peddleswap/sdk</div>
  </div>
</div>
